<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <ul id="accounts"></ul>
        <button id="move-money">Move Money</button>
        <div id="form-wrap">
            <form id="payment">
                <span id="close">&times;</span>
                <label for="amount">Amount</label>
                <input id="amount" type="number" required>
                <label for="listAcounts">Select your account</label>
                <select id="listAcounts" required>
                    <option>Shaye Cash</option>
                    <option>G rifky Cash</option>
                </select>
                <label for="description">Description</label>
                <input type="text" id="description">
                <div id="button-wraper">
                     <button id="credit" >credit</button>
                     <button id="debit" type="submit">debit</button>
                </div>
            </form>
        </div>
        <button id="tester">tester</button>
        <section id="transactions">
            <ul></ul>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
