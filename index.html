<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <ul id="accounts"></ul>
        <div id="menu-holder">
            <button id="move-money">Move Money</button>
            <button id="add-account">Add Account</button>
        </div>
        <div id="form-wrap-payment">
            <form id="payment">
                <span id="close-payment-form">&times;</span>
                <label for="amount">Amount</label>
                <input id="amount" type="number" required>
                <label for="listAcounts">Select your account</label>
                <select id="listAcounts" required>
                    <option>Shaye Cash</option>
                    <option>G rifky Cash</option>
                </select>
                <label for="description">Description</label>
                <input type="text" id="description">
                <div id="button-wraper">
                    <button id="credit">credit</button>
                    <button id="debit">debit</button>
                </div>
            </form>
        </div>
        <div id="form-wrap-account">
            <span id="close-account-form">&times;</span>
            <form id="add-account-form">
                <label for="name">Account Name</label>
                <input type="text" id="name" required>
                <p id="error-msg"></p>
                <div id="submit-acc-wrap">
                    <button id="submit-account">Create Account</button>
                </div>
            </form>
        </div>
        <section id="transactions">
            <div id="loading-spin-holder">
                <div id="loading-spin"></div>
            </div>
            <p id="transactions-header">
                <span id="account-name">Account Name</span>
                <span id="amount">Amount</span>
                <span id="description">Description</span>   
                <span id="new-balance">New Balance</span>
            </p>
            <ul></ul>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
